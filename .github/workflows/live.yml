name: Live providers

# The adapters against real provider accounts: test/live/, which `mix test`
# excludes. ci.yml proves what an adapter sends against stubs; this proves what
# the provider does with it, which a stub cannot know (managoat/fountain#2574:
# E2B 404s stdin by tag after a pause and resume, and every stubbed test
# passed).
#
# Scheduled and dispatched only, never on pull_request: it spends the
# accounts' money and their keys must not reach a fork's code. Sandboxes it
# creates carry the `msb-live-` name prefix; the suite destroys its own, and
# each job's last step destroys any a killed run left behind.
#
# A failed test is re-run once on its own. A provider's network blips (one
# envd start timing out in ~50 runs) would otherwise turn the job red often
# enough to be ignored; a real break fails twice. The re-run is a warning in
# the summary, never silent.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-providers
  cancel-in-progress: false

env:
  MIX_ENV: test

jobs:
  e2b:
    name: e2b
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      # The template Fountain's production names, so a template that stopped
      # booting or lost the `sprite` user fails here too.
      E2B_TEMPLATE: ${{ vars.E2B_TEMPLATE || 'fountain' }}

    steps:
      - name: Require the E2B key
        run: |
          if [ -z "${E2B_API_KEY}" ]; then
            echo "::error::E2B_API_KEY is not configured for this repository."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Live E2B suite
        timeout-minutes: 15
        run: |
          mix test --only live test/live/e2b_live_test.exs && exit 0
          echo "::warning::E2B live tests failed once; re-running only those"
          mix test --include live --failed

      - name: Destroy leftover live sandboxes
        if: always()
        timeout-minutes: 2
        run: |
          curl -fsS -H "x-api-key: ${E2B_API_KEY}" \
            "https://api.e2b.app/v2/sandboxes?state=running,paused&limit=100" |
            jq -r '.[] | select((.metadata.fountain_name // "") | startswith("msb-live-")) | .sandboxID' |
            while read -r id; do
              echo "destroying ${id}"
              curl -fsS -X DELETE -H "x-api-key: ${E2B_API_KEY}" "https://api.e2b.app/sandboxes/${id}" || true
            done

  sprites:
    name: sprites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # A token scoped to the `msb-live-` name prefix, not the organization's
      # production token: an unscoped one can exec into every sprite.
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}

    steps:
      - name: Require the Sprites token
        run: |
          if [ -z "${SPRITES_TOKEN}" ]; then
            echo "::error::SPRITES_TOKEN is not configured for this repository."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Live Sprites suite
        timeout-minutes: 18
        run: |
          mix test --only live test/live/sprites_live_test.exs && exit 0
          echo "::warning::Sprites live tests failed once; re-running only those"
          mix test --include live --failed

      - name: Destroy leftover live sprites
        if: always()
        timeout-minutes: 3
        run: |
          token=""
          while :; do
            page="$(curl -fsS -H "Authorization: Bearer ${SPRITES_TOKEN}" \
              "https://api.sprites.dev/v1/sprites?prefix=msb-live-${token:+&continuation_token=${token}}")" || break
            jq -r '.sprites[].name' <<< "${page}" | while read -r name; do
              echo "destroying ${name}"
              curl -fsS -X DELETE -H "Authorization: Bearer ${SPRITES_TOKEN}" \
                "https://api.sprites.dev/v1/sprites/${name}" || true
            done
            [ "$(jq -r '.has_more' <<< "${page}")" = "true" ] || break
            token="$(jq -r '.next_continuation_token' <<< "${page}")"
          done
