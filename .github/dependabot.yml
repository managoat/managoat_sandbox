# SHA-pinned actions never move on their own; dependabot is the only thing
# that will ever propose bumping them. A mix bump that touches a runtime
# dependency in mix.exs is a release (the release gate says so); a dev-only
# bump is not. Same shape as BinaryBourbon/fountain's.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    # Security + patch/minor noise control: one PR per week at most per group.
    groups:
      hex-deps:
        update-types: [minor, patch]
    # The Sprites client is pinned to exactly 0.2.0 on purpose: 0.2.2 changes
    # the close-frame contract, and the adapter and the conformance suite
    # must be revisited before the requirement moves (the comment on the dep
    # in mix.exs). A bump is a deliberate, conformance-tested change, never a
    # weekly one; Dependabot proposed 0.2.1 within an hour of the repo
    # existing (#1).
    ignore:
      - dependency-name: sprites
